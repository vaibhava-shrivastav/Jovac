<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Weather App</h1>

      <div class="search-box">
        <input type="text" id="input" placeholder="Enter city name..." />
        <button id="btn">Search</button>
      </div>

      <p id="loading"></p>

      <div id="weather"></div>

      <div id="news"></div>

      <div class="chatbot">
        <h2>chatbot</h2>

        <div id="bot-response" class="bot-response">
          <p class="bot-message">Hello! Ask me anything about weather.</p>
        </div>

        <div class="chat-input-box">
          <input type="text" id="bot-input" placeholder="Ask anything..." />

          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
